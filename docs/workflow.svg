<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Private wiki workflow</title><desc id="desc">Workflow diagram: Preserve sources then Curate linked knowledge then Check and retrieve.</desc><rect width="960" height="270" rx="12" fill="#f6f3ec"/><text x="30" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#222">Private wiki workflow</text><rect x="30" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="30" y="78" width="280" height="6" rx="3" fill="#4b4462"/><text x="48" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Preserve sources</text><text x="48" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Original files under .local</text><text x="48" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Capture immutable versions</text><path d="M318 153h13m-5-5 5 5-5 5" fill="none" stroke="#4b4462" stroke-width="2"/><rect x="340" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="340" y="78" width="280" height="6" rx="3" fill="#4b4462"/><text x="358" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Curate linked knowledge</text><text x="358" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Read, compare and cite</text><text x="358" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Markdown pages + records</text><path d="M628 153h13m-5-5 5 5-5 5" fill="none" stroke="#4b4462" stroke-width="2"/><rect x="650" y="78" width="280" height="150" rx="8" fill="#fff" stroke="#d5d1c8"/><rect x="650" y="78" width="280" height="6" rx="3" fill="#4b4462"/><text x="668" y="122" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#222">Check and retrieve</text><text x="668" y="161" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Validate links and metadata</text><text x="668" y="188" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#424242">Search, answer and review</text></svg>
